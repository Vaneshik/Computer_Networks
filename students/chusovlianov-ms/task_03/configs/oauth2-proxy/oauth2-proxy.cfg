## oauth2-proxy config for DbGate behind Keycloak OIDC

http_address = "0.0.0.0:4180"

# Upstream: DbGate web UI
upstreams = ["http://10.3.0.30:3000"]

# OIDC provider (Keycloak, realm=itmo)
provider = "oidc"
oidc_issuer_url = "http://10.3.0.50:8080/realms/itmo"
client_id = "dbgate"
client_secret = "dbgate-secret-2024"

# Redirect URI as seen by the browser (must match Keycloak client config)
redirect_url = "https://db.itmo-team.ru/oauth2/callback"

# Allow any authenticated user
email_domains = ["*"]

# Cookie settings
cookie_secret = "c29tZXNlY3JldHZhbHVlMTY="
cookie_secure = false
cookie_name = "_oauth2_proxy"

# Don't require HTTPS for cookie (we terminate TLS on lb-l7)
cookie_samesite = "lax"

# Pass authenticated user info to upstream
pass_access_token = true
pass_user_headers = true
set_xauthrequest = true

# Skip provider select page
skip_provider_button = true

# Allow access to oauth2-proxy's own endpoints without auth
skip_auth_routes = ["/oauth2/.*"]

scope = "openid profile email"
reverse_proxy = true
