worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

# L3/L4 TCP proxy: anycast VIP (10.99.0.1 / fd00:99::1) → lb-l7 (10.3.0.7)
stream {
    upstream lb7 {
        server 10.3.0.7:443;
    }

    server {
        listen 0.0.0.0:443;
        proxy_pass lb7;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }

    server {
        listen [::]:443;
        proxy_pass lb7;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}
