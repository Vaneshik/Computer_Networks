#!/usr/sbin/nft -f

flush ruleset

table inet filter {

    chain forward {
        type filter hook forward priority 0; policy drop;

        # Allow established / related connections (stateful)
        ct state established,related accept

        # DMZ → INT: allow only HTTPS to lb-l7
        iifname "eth1" oifname "eth2" ip daddr 10.3.0.7  tcp dport 443 ct state new accept
        iifname "eth1" oifname "eth2" ip6 daddr fd00:3::7 tcp dport 443 ct state new accept

        # INT → DMZ: allow return to lb-l34 only (responses handled by ct above)
        # (already covered by established/related)

        # INT → uplink (via nat-gw): allow outbound internet from INT for NAT
        # (traffic leaves eth2, not eth1 of firewall, so not seen here)

        # Block any direct access to postgres from outside INT
        oifname "eth2" ip daddr 10.3.0.20 tcp dport 5432 drop
        oifname "eth2" ip daddr 10.3.0.20 udp dport 5432 drop

        # Explicit drop with logging for denied DMZ→INT
        iifname "eth1" oifname "eth2" log prefix "[FW DROP] " drop
    }
}
