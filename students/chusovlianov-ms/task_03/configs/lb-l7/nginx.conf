worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Round-robin to web backends (itmo.ru)
    upstream web_backend {
        server 10.3.0.11:80;
        server 10.3.0.12:80;
        server 10.3.0.13:80;
    }

    # oauth2-proxy fronting dbgate (db.itmo-team.ru)
    upstream sso_backend {
        server 10.3.0.40:4180;
    }

    # Keycloak directly (auth.itmo-team.ru)
    upstream keycloak_backend {
        server 10.3.0.50:8080;
    }

    # ── Public site ──────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name itmo.ru www.itmo.ru _;

        ssl_certificate     /etc/ssl/certs/itmo.pem;
        ssl_certificate_key /etc/ssl/private/itmo.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass         http://web_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    # ── DB UI via SSO ─────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name db.itmo-team.ru;

        ssl_certificate     /etc/ssl/certs/itmo.pem;
        ssl_certificate_key /etc/ssl/private/itmo.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass         http://sso_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            # Required for oauth2-proxy cookie handling
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
        }
    }

    # ── Keycloak admin / OIDC ─────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name auth.itmo-team.ru;

        ssl_certificate     /etc/ssl/certs/itmo.pem;
        ssl_certificate_key /etc/ssl/private/itmo.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass              http://keycloak_backend;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto https;
            proxy_read_timeout      90;
            # Needed for Keycloak's larger headers
            proxy_buffer_size       64k;
            proxy_buffers           8 64k;
        }
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        return 301 https://$host$request_uri;
    }
}
